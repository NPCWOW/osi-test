<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Загрузка теста ОСИ</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:#f5f7fb;color:#182033;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;margin:24px;padding:28px;border-radius:22px;background:#fff;box-shadow:0 16px 42px rgba(25,40,85,.12);text-align:center}.spin{width:42px;height:42px;border:5px solid #e4e8f0;border-top-color:#3457d5;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:24px;margin:0 0 8px}p{color:#687189;line-height:1.5}</style></head><body><div class="box"><div class="spin"></div><h1>Загружаем тест ОСИ</h1><p id="status">Подождите несколько секунд…</p></div><script>(function(){var n=14,arr=[],done=0,failed=false;function finish(){if(failed||done!==n)return;var html=arr.join('');document.open();document.write(html);document.close()}for(var i=1;i<=n;i++){(function(k){var x=new XMLHttpRequest();x.open('GET','part'+(k<10?'0':'')+k+'.txt?v=3',true);x.onreadystatechange=function(){if(x.readyState===4){if(x.status>=200&&x.status<300){arr[k-1]=x.responseText;done++;document.getElementById('status').textContent='Загружено '+done+' из '+n;finish()}else{failed=true;document.getElementById('status').innerHTML='Не удалось загрузить часть теста. Обновите страницу в Safari.'}}};x.send()})(i)}})();</script></body></html>
