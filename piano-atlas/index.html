<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101014"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Piano Atlas"><meta name="format-detection" content="telephone=no"><title>Piano Atlas</title><style>
:root{--b:#101014;--p:#1b1b21;--p2:#25252d;--t:#f8f4eb;--m:#aaa69d;--g:#d6b16f;--g2:#f2dcad;--l:#ffffff17}*{box-sizing:border-box}html{background:var(--b)}body{margin:0;color:var(--t);background:radial-gradient(circle at 20% 0,#d6b16f1b,transparent 32%),var(--b);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.app{padding-bottom:calc(92px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:#101014dc;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--l)}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--g2),var(--g));color:#17120b;font-size:21px}.sub{font-size:11px;color:var(--m);font-weight:650}.round{width:42px;height:42px;border:1px solid var(--l);border-radius:13px;background:var(--p);color:var(--t)}main{width:min(1050px,100%);margin:auto;padding:14px}.hero{padding:24px 20px;min-height:250px;border:1px solid var(--l);border-radius:27px;background:radial-gradient(circle at 85% 20%,#d6b16f3a,transparent 35%),linear-gradient(135deg,#28262d,#17171c);box-shadow:0 18px 45px #0005}.ey{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--g2);font-weight:850}h1{font:700 clamp(38px,10vw,70px)/.98 Georgia,serif;margin:12px 0}h2{font:700 28px Georgia,serif;margin:0}.hero p{color:#d0ccc3;line-height:1.55;max-width:650px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.primary,.secondary{border-radius:14px;padding:12px 15px;font-weight:800}.primary{border:0;background:linear-gradient(135deg,var(--g2),var(--g));color:#17120b}.secondary{border:1px solid var(--l);background:#ffffff0b;color:var(--t)}.controls{display:grid;grid-template-columns:1fr auto;gap:9px;margin:18px 0}.controls input,.controls select{height:48px;border:1px solid var(--l);border-radius:15px;background:var(--p);color:var(--t);padding:0 14px;min-width:0}.head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:27px 0 13px}.head p{margin:4px 0 0;color:var(--m);font-size:13px}.count{color:var(--m);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.era,.card{border:1px solid var(--l);border-radius:20px;background:linear-gradient(145deg,var(--p2),var(--p));color:var(--t);text-align:left}.era{position:relative;min-height:160px;padding:16px}.era b{font:700 42px Georgia,serif;color:var(--g)}.era h3,.card h3{margin:7px 0 5px}.era p,.card p{margin:0;color:var(--m);font-size:12px;line-height:1.45}.arrow{position:absolute;right:15px;bottom:12px;color:var(--g2);font-size:21px}.card{overflow:hidden}.cover{height:110px;padding:15px;display:flex;align-items:end;background:radial-gradient(circle at 70% 25%,#d6b16f38,transparent 38%),#292731;font:700 25px Georgia,serif}.body{padding:14px}.pill{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:4px 7px;margin:0 5px 7px 0;font-size:10px;color:#ddd7cb}.open{width:100%;margin-top:12px;border:1px solid #d6b16f4a;border-radius:11px;background:#d6b16f20;color:var(--g2);padding:9px;font-weight:800}.crumb{display:flex;gap:7px;align-items:center;color:var(--m);font-size:12px;margin:2px 0 12px;overflow:auto;white-space:nowrap}.crumb button{border:0;background:none;color:var(--g2);padding:0}.works{display:grid;gap:9px}.work{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px;border:1px solid var(--l);border-radius:16px;background:var(--p)}.wt{font-weight:800}.ws{font-size:11px;color:var(--m);margin-top:5px}.dots{display:inline-flex;gap:2px;margin-left:5px}.dot{width:6px;height:6px;border-radius:50%;background:#44444c}.dot.on{background:var(--g)}.wa{display:flex;gap:6px}.mini{width:38px;height:38px;border:1px solid var(--l);border-radius:11px;background:var(--p2);color:var(--t)}.mini.on{background:var(--g);color:#17120b}.empty{text-align:center;color:var(--m);padding:30px;border:1px dashed var(--l);border-radius:18px}.nav{position:fixed;z-index:8;left:50%;bottom:calc(11px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(510px,calc(100% - 22px));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:7px;border:1px solid var(--l);border-radius:19px;background:#1b1b21ed;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}.nav button{border:0;border-radius:12px;padding:9px 4px;background:transparent;color:var(--m);font-size:11px;font-weight:750}.nav button.on{background:#d6b16f20;color:var(--g2)}.nav span{display:block;font-size:18px;margin-bottom:2px}.modal{display:none;position:fixed;inset:0;z-index:20;align-items:flex-end;background:#000b;padding:10px}.modal.on{display:flex}.modalbox{width:min(850px,100%);max-height:94dvh;margin:auto;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--l);border-radius:24px;background:#151519}.mh{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:13px;background:#151519ed;border-bottom:1px solid var(--l)}.mh b{font-size:14px}.close{width:38px;height:38px;border-radius:11px;border:1px solid var(--l);background:var(--p2);color:var(--t)}.score{padding:13px}.notice{padding:10px;border-radius:12px;background:#d6b16f18;color:#ecd9b2;font-size:12px}.sheet{margin-top:10px;min-height:620px;padding:26px 17px;border-radius:8px;background:#fbfaf5;color:#202020}.sheet h3,.sheet p{text-align:center}.staff{height:82px;margin:16px 0;background:repeating-linear-gradient(to bottom,transparent 0 12px,#333 12px 13px);overflow:hidden}.notes{font:32px/68px Georgia,serif;letter-spacing:10px;white-space:nowrap}.toast{position:fixed;z-index:30;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;padding:10px 13px;border-radius:12px;background:#f3eadc;color:#17120b;font-weight:800;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){main{padding:11px}.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.work{grid-template-columns:1fr}.wa{justify-content:flex-end}.hero{min-height:285px}.top{padding-left:11px;padding-right:11px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">♩</div><div>Piano Atlas<div class="sub">тестовая версия для Валерии</div></div></div><button class="round" id="random">↻</button></header><main id="main"></main><nav class="nav"><button class="on" data-v="home"><span>⌂</span>Обзор</button><button data-v="fav"><span>♡</span>Избранное</button><button data-v="learn"><span>✓</span>Хочу выучить</button></nav></div><div class="modal" id="modal"><div class="modalbox"><div class="mh"><b id="mt">Ноты</b><button class="close" id="close">✕</button></div><div class="score" id="score"></div></div></div><div class="toast" id="toast"></div><script>
var DATA=[
{id:'baroque',n:'Барокко',y:'1600–1750',d:'Полифония, ясная архитектура и ритмическая энергия.',c:[{id:'bach',n:'Иоганн Себастьян Бах',l:'1685–1750',k:'Германия',a:'Инвенции, прелюдии и фуги.',w:[['b1','Прелюдия до мажор, BWV 846',3,'2–3 мин','светлое',1],['b2','Инвенция №1, BWV 772',5,'2 мин','собранное',1],['b3','Менуэт соль мажор',2,'2 мин','лёгкое',1]]},{id:'scar',n:'Доменико Скарлатти',l:'1685–1757',k:'Италия',a:'Виртуозные клавирные сонаты.',w:[['s1','Соната ре минор, K.32',4,'3 мин','задумчивое',1],['s2','Соната ре минор, K.141',8,'4 мин','драматичное',1]]}]},
{id:'classic',n:'Классицизм',y:'1750–1820',d:'Баланс, ясная форма и выразительная мелодия.',c:[{id:'mozart',n:'Вольфганг Амадей Моцарт',l:'1756–1791',k:'Австрия',a:'Прозрачная фактура и безупречная форма.',w:[['m1','Соната до мажор, K.545',5,'4–5 мин','изящное',1],['m2','Турецкий марш, K.331',7,'3–4 мин','энергичное',1]]},{id:'beet',n:'Людвиг ван Бетховен',l:'1770–1827',k:'Германия',a:'Мост между классицизмом и романтизмом.',w:[['v1','К Элизе, WoO 59',5,'3 мин','лирическое',1],['v2','Лунная соната — I часть',6,'6 мин','меланхоличное',1]]}]},
{id:'romantic',n:'Романтизм',y:'1810–1910',d:'Эмоциональность, свобода формы и виртуозность.',c:[{id:'chopin',n:'Фредерик Шопен',l:'1810–1849',k:'Польша',a:'Поэзия фортепиано: ноктюрны, вальсы, мазурки.',w:[['c1','Прелюдия ми минор, Op.28 №4',4,'2 мин','печальное',1],['c2','Вальс ля минор, B.150',4,'2–3 мин','лирическое',1],['c3','Ноктюрн Op.9 №2',7,'4–5 мин','романтическое',1]]},{id:'tchai',n:'Пётр Чайковский',l:'1840–1893',k:'Россия',a:'Лирические миниатюры и яркая образность.',w:[['t1','Утренняя молитва, Op.39 №1',3,'2 мин','спокойное',1],['t2','Октябрь. Осенняя песнь',6,'5 мин','ностальгическое',1]]},{id:'rach',n:'Сергей Рахманинов',l:'1873–1943',k:'Россия',a:'Широкая мелодика и мощная фактура.',w:[['r1','Прелюдия до-диез минор',8,'4–5 мин','драматичное',1],['r2','Вокализ — переложение',7,'5–6 мин','лирическое',0]]}]},
{id:'impress',n:'Импрессионизм',y:'1880–1920',d:'Краски, атмосфера и тонкие гармонии.',c:[{id:'debussy',n:'Клод Дебюсси',l:'1862–1918',k:'Франция',a:'Музыкальные картины и свободная гармония.',w:[['d1','Лунный свет',7,'5 мин','воздушное',1],['d2','Арабеска №1',6,'4 мин','текучее',1]]},{id:'satie',n:'Эрик Сати',l:'1866–1925',k:'Франция',a:'Простота, пространство и ирония.',w:[['e1','Gymnopédie №1',4,'3–4 мин','медитативное',1],['e2','Gnossienne №1',5,'3 мин','таинственное',1]]}]},
{id:'modern',n:'XX век',y:'1900–2000',d:'Новые ритмы, гармонии и фортепианные языки.',c:[{id:'prok',n:'Сергей Прокофьев',l:'1891–1953',k:'Россия',a:'Моторика, сарказм и выразительная мелодия.',w:[['p1','Мимолётности — избранное',7,'1–3 мин','контрастное',0]]},{id:'shost',n:'Дмитрий Шостакович',l:'1906–1975',k:'СССР',a:'Ирония, трагизм и ясная логика.',w:[['h1','Прелюдия ми минор, Op.34 №4',6,'2 мин','сдержанное',0]]}]},
{id:'neo',n:'Неоклассика',y:'2000–сейчас',d:'Минималистичная музыка для сцены и кино.',c:[{id:'einaudi',n:'Людовико Эйнауди',l:'1955–',k:'Италия',a:'Повторяющиеся фактуры и кинематографичная лирика.',w:[['n1','Nuvole Bianche',5,'6 мин','вдохновляющее',0],['n2','Experience',6,'5 мин','нарастающее',0]]},{id:'richter',n:'Макс Рихтер',l:'1966–',k:'Великобритания',a:'Неоклассика, электроника и музыка для кино.',w:[['n3','Written on the Sky',5,'3 мин','созерцательное',0]]}]}
];
function $(s){return document.querySelector(s)}function storeGet(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function storeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}var S={v:'home',era:null,comp:null,q:'',level:'all',fav:storeGet('pa_fav'),learn:storeGet('pa_learn')};
function all(){var a=[];DATA.forEach(function(e){e.c.forEach(function(c){c.w.forEach(function(x){a.push({id:x[0],title:x[1],level:x[2],time:x[3],mood:x[4],free:x[5],comp:c.n,cid:c.id,era:e.n,eid:e.id})})})});return a}function era(id){return DATA.filter(function(x){return x.id===id})[0]}function comp(id){var r;DATA.forEach(function(e){e.c.forEach(function(c){if(c.id===id)r=c})});return r}function work(id){return all().filter(function(x){return x.id===id})[0]}function dots(n){var s='<span class="dots">';for(var i=0;i<10;i++)s+='<i class="dot '+(i<n?'on':'')+'"></i>';return s+'</span>'}function toast(t){var x=$('#toast');x.textContent=t;x.classList.add('on');setTimeout(function(){x.classList.remove('on')},1500)}function nav(){document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===S.v)})}function go(v){S.v=v;render()}function render(){nav();if(S.v==='home')home();if(S.v==='era')eraView();if(S.v==='comp')compView();if(S.v==='fav')listView('Избранное',S.fav,'Отмечайте произведения сердцем.');if(S.v==='learn')listView('Хочу выучить',S.learn,'Добавляйте произведения в план занятий.');try{scrollTo({top:0,behavior:'smooth'})}catch(e){scrollTo(0,0)}}
function controls(){return'<div class="controls"><input id="q" placeholder="Найти произведение или композитора…"><select id="level"><option value="all">Любая сложность</option><option value="easy">1–4: начинающий</option><option value="mid">5–7: средний</option><option value="hard">8–10: продвинутый</option></select></div><div id="results"></div>'}function bindControls(){var q=$('#q'),l=$('#level');q.value=S.q;l.value=S.level;q.oninput=function(){S.q=this.value;results()};l.onchange=function(){S.level=this.value;results()}}function match(w){var q=S.q.toLowerCase().trim(),ok=!q||(w.title+' '+w.comp+' '+w.era+' '+w.mood).toLowerCase().indexOf(q)>-1;return ok&&(S.level==='all'||S.level==='easy'&&w.level<=4||S.level==='mid'&&w.level>=5&&w.level<=7||S.level==='hard'&&w.level>=8)}function results(){var a=all().filter(match);$('#results').innerHTML=S.q||S.level!=='all'?rows(a):'';bindWorks()}
function home(){$('#main').innerHTML='<section class="hero"><div class="ey">Навигатор по фортепианной музыке</div><h1>Открой музыку по эпохам.</h1><p>Выберите период, композитора и произведение. Сохраняйте репертуар и открывайте демонстрационные ноты прямо на телефоне.</p><div class="actions"><button class="primary" id="start">Выбрать эпоху</button><button class="secondary" id="pick">Подобрать случайно</button></div></section>'+controls()+'<div class="head" id="eras"><div><h2>Музыкальные эпохи</h2><p>От барокко до современной неоклассики</p></div><span class="count">'+DATA.length+' разделов</span></div><section class="grid">'+DATA.map(function(e,i){return'<button class="era" data-era="'+e.id+'"><b>0'+(i+1)+'</b><h3>'+e.n+'</h3><p>'+e.y+'<br>'+e.d+'</p><span class="arrow">→</span></button>'}).join('')+'</section><div class="head"><div><h2>Для первого просмотра</h2></div></div><section class="grid">'+['chopin','bach','debussy'].map(function(id){return card(comp(id))}).join('')+'</section>';$('#start').onclick=function(){$('#eras').scrollIntoView({behavior:'smooth'})};$('#pick').onclick=random;document.querySelectorAll('[data-era]').forEach(function(b){b.onclick=function(){S.era=this.dataset.era;go('era')}});bindControls();bindComps()}
function card(c){var e;DATA.forEach(function(x){if(x.c.indexOf(c)>-1)e=x});return'<article class="card"><div class="cover">'+c.n.split(' ').pop()+'</div><div class="body"><span class="pill">'+e.n+'</span><span class="pill">'+c.k+'</span><h3>'+c.n+'</h3><p>'+c.a+'</p><button class="open opencomp" data-c="'+c.id+'">'+c.w.length+' произведений</button></div></article>'}function bindComps(){document.querySelectorAll('.opencomp').forEach(function(b){b.onclick=function(){S.comp=this.dataset.c;DATA.forEach(function(e){e.c.forEach(function(c){if(c.id===S.comp)S.era=e.id})});go('comp')}})}
function eraView(){var e=era(S.era);$('#main').innerHTML='<div class="crumb"><button id="home">Обзор</button><span>›</span><span>'+e.n+'</span></div><section class="hero"><div class="ey">'+e.y+'</div><h1>'+e.n+'</h1><p>'+e.d+'</p></section><div class="head"><div><h2>Композиторы</h2><p>Выберите автора</p></div><span class="count">'+e.c.length+'</span></div><section class="grid">'+e.c.map(card).join('')+'</section>';$('#home').onclick=function(){go('home')};bindComps()}
function compView(){var c=comp(S.comp),e=era(S.era);var ww=c.w.map(function(x){return{id:x[0],title:x[1],level:x[2],time:x[3],mood:x[4],free:x[5],comp:c.n}});$('#main').innerHTML='<div class="crumb"><button id="home">Обзор</button><span>›</span><button id="back">'+e.n+'</button><span>›</span><span>'+c.n+'</span></div><section class="hero"><div class="ey">'+c.k+' · '+c.l+'</div><h1>'+c.n+'</h1><p>'+c.a+'</p></section><div class="head"><div><h2>Произведения</h2><p>Сложность, длительность и доступность нот</p></div></div><section class="works">'+rows(ww)+'</section>';$('#home').onclick=function(){go('home')};$('#back').onclick=function(){go('era')};bindWorks()}
function rows(a){if(!a.length)return'<div class="empty">Ничего не найдено.</div>';return a.map(function(w){return'<article class="work"><div><div class="wt">'+w.title+dots(w.level)+'</div><div class="ws">'+(w.comp?w.comp+' · ':'')+w.time+' · '+w.mood+'</div></div><div class="wa"><button class="mini fav '+(S.fav.indexOf(w.id)>-1?'on':'')+'" data-id="'+w.id+'">♡</button><button class="mini learn '+(S.learn.indexOf(w.id)>-1?'on':'')+'" data-id="'+w.id+'">✓</button><button class="mini scorebtn" data-id="'+w.id+'">♫</button></div></article>'}).join('')}function bindWorks(){document.querySelectorAll('.fav').forEach(function(b){b.onclick=function(){toggle('fav',this.dataset.id)}});document.querySelectorAll('.learn').forEach(function(b){b.onclick=function(){toggle('learn',this.dataset.id)}});document.querySelectorAll('.scorebtn').forEach(function(b){b.onclick=function(){openScore(this.dataset.id)}})}function toggle(k,id){var a=S[k],i=a.indexOf(id);if(i>-1){a.splice(i,1);toast('Удалено')}else{a.push(id);toast('Добавлено')}storeSet('pa_'+k,a);render()}function listView(title,ids,empty){var a=ids.map(work).filter(Boolean);$('#main').innerHTML='<section class="hero"><div class="ey">Личная коллекция</div><h1>'+title+'</h1><p>'+empty+'</p></section><div class="head"><div><h2>'+(a.length?'Ваш список':'Пока пусто')+'</h2></div><span class="count">'+a.length+'</span></div><section class="works">'+(a.length?rows(a):'<div class="empty">'+empty+'</div>')+'</section>';bindWorks()}
function openScore(id){var w=work(id);$('#mt').textContent=w.title;var lock=w.free?'Демонстрационная страница. В рабочей версии здесь будет легальный PDF.':'Ноты защищены авторским правом. Здесь будет ссылка на покупку или лицензированная версия.';var body='<div class="notice">'+lock+'</div><div class="sheet"><h3>'+w.title+'</h3><p>'+w.comp+'</p>';if(!w.free)body+='<p style="font-size:45px;margin-top:120px">🔒</p>';else{var p=['♩ ♪ ♫ ♩ ♩ ♪ ♫','♫ ♩ ♪ ♩ ♫ ♪ ♩','♩ ♩ ♫ ♪ ♩ ♫ ♪','♪ ♫ ♩ ♪ ♩ ♩ ♫','♫ ♪ ♩ ♫ ♪ ♩ ♪'];p.forEach(function(x){body+='<div class="staff"><div class="notes">'+x+'</div></div>'})}$('#score').innerHTML=body+'</div>';$('#modal').classList.add('on')}function random(){var a=all();openScore(a[Math.floor(Math.random()*a.length)].id)}
$('#close').onclick=function(){$('#modal').classList.remove('on')};$('#modal').onclick=function(e){if(e.target===this)this.classList.remove('on')};$('#random').onclick=random;document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){S.era=null;S.comp=null;go(this.dataset.v)}});render();
</script></body></html>
